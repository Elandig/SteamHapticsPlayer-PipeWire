name: Linux build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libpipewire-0.3-dev libhidapi-dev

      - name: Build and check startup
        run: |
          make -j2 release
          ./steam-haptics-sink --help

      - name: Package Linux binaries
        run: |
          tar -czf steam-haptics-linux-x86_64.tar.gz \
            --transform='s,^,steam-haptics/,' \
            steam-haptics-sink steam-haptics-player README.md LICENSE TritonLib/LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: steam-haptics-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset=steam-haptics-linux-x86_64.tar.gz
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-from-tag
          fi
          if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft) == true ]]; then
            gh release upload "$TAG" "$asset" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$asset"
          fi
